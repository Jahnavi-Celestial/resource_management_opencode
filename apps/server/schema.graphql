type Query {
  me: MeType!
  bookings(filter: BookingFilterInput, sort: SortInput, page: Int! = 1, pageSize: Int! = 20): PaginatedBookings!
  booking(id: ID!): BookingType!
  employees(page: Int! = 1, pageSize: Int! = 20, search: String, sort: SortInput): PaginatedEmployee!
  employee(id: String!): Employee!
  equipment(page: Int! = 1, pageSize: Int! = 20, search: String, activeOnly: Boolean! = false, sort: SortInput): PaginatedEquipment!
  equipmentAvailability(endDate: DateTimeISO!, startDate: DateTimeISO!, equipmentId: String!): EquipmentAvailabilityResult!
  auditLogs(filter: AuditLogFilter, sort: SortInput, page: Int! = 1, pageSize: Int! = 20, bookingId: ID, actorId: ID, performedById: ID, action: AuditAction, status: BookingStatus, from: DateTimeISO, to: DateTimeISO): PaginatedAuditLogs!
  permissions(pageSize: Int! = 20, page: Int! = 1): PermissionPage!
  role(id: String!): Role!
  roles(pageSize: Int! = 20, page: Int! = 1): RolePage!
  rooms(page: Int! = 1, pageSize: Int! = 20, search: String, minCapacity: Int, maxCapacity: Int, activeOnly: Boolean! = false, sort: SortInput): PaginatedRoom!
  roomAvailability(endDate: DateTimeISO!, startDate: DateTimeISO!, roomId: String!): [RoomBookingSummary!]!
}

type MeType {
  employee: Employee!
  roles: [Role!]!
  permissionKeys: [String!]!
}

type Employee {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  createdAt: DateTimeISO!
  updatedAt: DateTimeISO!
  roles: [Role!]!
  bookingHistory: [EmployeeBookingSummary!]
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTimeISO

type Role {
  id: ID!
  roleName: String!
  permissions: [Permission!]!
}

type Permission {
  id: ID!
  permissionName: String!
}

type EmployeeBookingSummary {
  id: ID!
  startTime: DateTimeISO!
  endTime: DateTimeISO!
  purpose: String!
  status: String!
}

type PaginatedBookings {
  items: [BookingType!]!
  totalCount: Int!
}

type BookingType {
  id: ID!
  employeeId: ID
  roomId: ID!
  startTime: DateTimeISO!
  endTime: DateTimeISO!
  purpose: String!
  rejectionReason: String
  numberOfAttendees: Int!
  status: BookingListStatus!
  createdAt: DateTimeISO!
  updatedAt: DateTimeISO!
  processedAt: DateTimeISO
  processedBy: BookingActor
  statusHistory: [BookingStatusTransition!]!
  requester: BookingRequester!
  room: BookingRoom!
  equipmentLines: [BookingEquipmentDetail!]!
}

enum BookingListStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELLED
  COMPLETED
}

type BookingActor {
  id: ID
  name: String!
}

type BookingStatusTransition {
  id: ID!
  oldStatus: BookingListStatus
  newStatus: BookingListStatus!
  actor: BookingActor!
  transitionedAt: DateTimeISO!
}

type BookingRequester {
  id: ID
  name: String!
  email: String!
  recentBookings: [BookingSummary!]!
}

type BookingSummary {
  id: ID!
  startTime: DateTimeISO!
  endTime: DateTimeISO!
  purpose: String!
  status: BookingListStatus!
}

type BookingRoom {
  id: ID!
  name: String!
  location: String!
  capacity: Int!
  otherBookings: [BookingSummary!]!
}

type BookingEquipmentDetail {
  id: ID!
  equipmentId: ID!
  name: String!
  requestedQuantity: Int!
  remainingAvailability: Int!
}

input BookingFilterInput {
  search: String
  status: BookingListStatus
  startDate: DateTimeISO
  endDate: DateTimeISO
}

input SortInput {
  field: String!
  direction: String! = "ASC"
}

type PaginatedEmployee {
  items: [Employee!]!
  totalCount: Int!
}

type PaginatedEquipment {
  items: [Equipment!]!
  totalCount: Int!
}

type Equipment {
  id: ID!
  name: String!
  quantityAvailable: Int!
  isActive: Boolean!
  createdAt: DateTimeISO!
  updatedAt: DateTimeISO!
}

type EquipmentAvailabilityResult {
  equipmentId: ID!
  name: String!
  quantityAvailable: Int!
  remainingAvailability: Int!
}

type PaginatedAuditLogs {
  items: [AuditLog!]!
  totalCount: Int!
}

type AuditLog {
  id: ID!
  bookingId: ID!
  action: AuditAction!
  oldStatus: BookingStatus
  newStatus: BookingStatus!
  performedById: ID
  performedBy: AuditActor
  performedByName: String!
  performedByDisplayName: String!
  createdAt: DateTimeISO!
}

enum AuditAction {
  CREATE
  APPROVE
  REJECT
  CANCEL
  COMPLETE
}

enum BookingStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELLED
  COMPLETED
}

type AuditActor {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  displayName: String!
}

input AuditLogFilter {
  bookingId: ID
  actorId: ID
  performedById: ID
  action: AuditAction
  status: BookingStatus
  from: DateTimeISO
  to: DateTimeISO
  startDate: DateTimeISO
  endDate: DateTimeISO
}

type PermissionPage {
  items: [Permission!]!
  total: Int!
}

type RolePage {
  items: [Role!]!
  total: Int!
}

type PaginatedRoom {
  items: [Room!]!
  totalCount: Int!
}

type Room {
  id: ID!
  name: String!
  location: String!
  capacity: Int!
  isActive: Boolean!
  createdAt: DateTimeISO!
  updatedAt: DateTimeISO!
  availability: [RoomBookingSummary!]
}

type RoomBookingSummary {
  id: ID!
  startTime: DateTimeISO!
  endTime: DateTimeISO!
  purpose: String!
  status: String!
}

type Mutation {
  login(input: LoginInput!): String!
  createEmployee(input: CreateEmployeeInput!): Employee!
  updateEmployee(input: UpdateEmployeeInput!): Employee!
  deleteEmployee(id: String!): Boolean!
  createEquipment(input: CreateEquipmentInput!): Equipment!
  updateEquipment(input: UpdateEquipmentInput!): Equipment!
  assignPermissionToRole(input: RolePermissionInput!): Role!
  removePermissionFromRole(input: RolePermissionInput!): Role!
  assignRoleToEmployee(input: EmployeeRoleInput!): Employee!
  removeRoleFromEmployee(input: EmployeeRoleInput!): Employee!
  createRole(input: CreateRoleInput!): Role!
  updateRole(input: UpdateRoleInput!): Role!
  deleteRole(id: String!): Boolean!
  createRoom(input: CreateRoomInput!): Room!
  updateRoom(input: UpdateRoomInput!): Room!
}

input LoginInput {
  email: String!
  password: String!
}

input CreateEmployeeInput {
  firstName: String!
  lastName: String!
  email: String!
  password: String!
}

input UpdateEmployeeInput {
  id: ID!
  firstName: String
  lastName: String
  email: String
  password: String
}

input CreateEquipmentInput {
  name: String!
  quantityAvailable: Int!
}

input UpdateEquipmentInput {
  id: ID!
  name: String
  quantityAvailable: Int
  isActive: Boolean
}

input RolePermissionInput {
  roleId: ID!
  permissionId: ID!
}

input EmployeeRoleInput {
  employeeId: ID!
  roleId: ID!
}

input CreateRoleInput {
  roleName: String!
}

input UpdateRoleInput {
  id: ID!
  roleName: String!
}

input CreateRoomInput {
  name: String!
  location: String!
  capacity: Int!
}

input UpdateRoomInput {
  id: ID!
  name: String
  location: String
  capacity: Int
  isActive: Boolean
}